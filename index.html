<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#0B1A2E;--ink2:#4A5568;--line:#DCE0E6;--blue:#1F5BD8;--bad:#A33A2E}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--card:#161E2C;--ink:#E8ECF2;--ink2:#A3ADBD;--line:#2A3446;--blue:#7FA6F5;--bad:#EE8C80;color-scheme:dark}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.gate{width:min(360px,calc(100vw - 32px));box-sizing:border-box;padding:28px 28px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mark{display:inline-block;margin-bottom:16px;font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
h1{margin:0 0 4px;font-size:18px;font-weight:600}
p{margin:0 0 20px;color:var(--ink2);font-size:14px}
input{width:100%;box-sizing:border-box;height:40px;padding:0 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;height:40px;border:0;border-radius:8px;background:var(--ink);color:var(--card);font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6}
.err{min-height:20px;margin:10px 0 0;color:var(--bad);font-size:13px}
</style></head>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById("gate"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  form.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = ""; go.disabled = true;
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)));
      document.open(); document.write(html); document.close();
    } catch (e) { err.textContent = "Das Passwort stimmt nicht."; pw.select(); go.disabled = false; }
  });
})();
</script>
